<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DynoQR - Dynamic QR Code Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #131d31; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 50; }
    .brand { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; color: #fff; }
    .user-info { display: flex; align-items: center; gap: 0.75rem; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-border); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1.1rem; border-radius: 8px; font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; transition: 0.2s ease; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
    .grid-editor { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
    @media (max-width: 768px) { .grid-editor { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    h2, h3 { color: #fff; font-weight: 700; margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted); }
    input, select { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--card-border); background: #0b1120; color: #fff; outline: none; font-size: 0.9rem; }
    input:focus, select:focus { border-color: var(--primary); }
    .preview-panel { position: sticky; top: 5rem; text-align: center; }
    .qr-canvas-box { width: 250px; height: 250px; margin: 1rem auto; background: #ffffff; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; padding: 10px; }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.25rem; margin-top: 1rem; }
    .qr-item { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .qr-badge { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 99px; }
    .badge-active { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
    .badge-paused { background: rgba(245,158,11,0.2); color: #fde68a; border: 1px solid rgba(245,158,11,0.4); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); max-width: 450px; width: 100%; padding: 1.5rem; }
    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--card); border: 1px solid var(--card-border); color: #fff; padding: 0.75rem 1.25rem; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); transform: translateY(100px); opacity: 0; transition: 0.3s ease; z-index: 999; }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <nav>
    <div class="brand">⚡ DynoQR</div>
    <div id="auth-section">
      <button id="google-login-btn" class="btn btn-outline btn-sm">Sign in with Google</button>
      <div id="logged-in-view" style="display: none;" class="user-info">
        <img id="user-img" class="avatar" src="" alt="">
        <span id="user-display" style="font-size: 0.85rem; font-weight: 600;"></span>
        <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="grid-editor">
      <div>
        <div class="card">
          <h2>Create Dynamic QR Code</h2>
          <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.25rem;">
            Destination URL बाद में कभी भी बदल सकते हैं बिना QR बदले!
          </p>

          <div class="form-group">
            <label for="qr-name">QR Name</label>
            <input type="text" id="qr-name" placeholder="My Campaign" value="My Project QR">
          </div>

          <div class="form-group">
            <label for="qr-destination">Destination URL (जहाँ भेजना है) *</label>
            <input type="url" id="qr-destination" placeholder="https://example.com" value="https://google.com">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="qr-dots-color">Dots Color</label>
              <input type="color" id="qr-dots-color" value="#0f172a" style="height: 40px; padding: 4px;">
            </div>
            <div class="form-group">
              <label for="qr-bg-color">Background Color</label>
              <input type="color" id="qr-bg-color" value="#ffffff" style="height: 40px; padding: 4px;">
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="card preview-panel">
          <h3>QR Preview</h3>
          <div class="qr-canvas-box" id="qr-preview"></div>
          <button id="save-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 0.5rem;">
            Save & Activate Dynamic QR
          </button>
          <button id="download-btn" class="btn btn-outline" style="width: 100%;">
            Download PNG
          </button>
        </div>
      </div>
    </div>

    <div style="margin-top: 2rem;">
      <h3>Your Created QR Codes</h3>
      <div id="qr-list" class="qr-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">
          Please Sign in with Google to view and manage your QR codes.
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="edit-modal">
    <div class="modal-box">
      <h3>Change Destination URL</h3>
      <input type="hidden" id="modal-qr-id">
      <div class="form-group" style="margin-top:1rem;">
        <label>Campaign Name</label>
        <input type="text" id="modal-qr-name">
      </div>
      <div class="form-group">
        <label>New Destination URL</label>
        <input type="url" id="modal-qr-dest" placeholder="https://">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
        <button id="close-modal-btn" class="btn btn-outline btn-sm">Cancel</button>
        <button id="update-modal-btn" class="btn btn-primary btn-sm">Update URL</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBLYBG19XPLoHIfrWFf_1U_y4KtaogM65A",
      authDomain: "dynamic-qr-8c011.firebaseapp.com",
      projectId: "dynamic-qr-8c011",
      storageBucket: "dynamic-qr-8c011.firebasestorage.app",
      messagingSenderId: "618665607161",
      appId: "1:618665607161:web:990ee3f86759720962c728"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentId = generateId(8);

    function getRedirectUrl(id) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const basePath = (window.location.hostname.endsWith('github.io') && parts.length > 0) ? `/${parts[0]}/` : '/';
      return `${window.location.origin}${basePath}redirect.html?id=${id}`;
    }

    function generateId(len = 8) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let res = '';
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      for(let i=0; i<len; i++) res += chars[arr[i] % chars.length];
      return res;
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    const qrDesigner = new QRCodeStyling({
      width: 230,
      height: 230,
      data: getRedirectUrl(currentId),
      dotsOptions: { color: '#0f172a', type: 'rounded' },
      backgroundOptions: { color: '#ffffff' },
      cornersSquareOptions: { type: 'extra-rounded' }
    });
    qrDesigner.append(document.getElementById('qr-preview'));

    function updateColors() {
      qrDesigner.update({
        dotsOptions: { color: document.getElementById('qr-dots-color').value },
        backgroundOptions: { color: document.getElementById('qr-bg-color').value }
      });
    }

    document.getElementById('qr-dots-color').addEventListener('input', updateColors);
    document.getElementById('qr-bg-color').addEventListener('input', updateColors);

    // Auth
    document.getElementById('google-login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginBtn = document.getElementById('google-login-btn');
      const loggedInView = document.getElementById('logged-in-view');
      if (user) {
        loginBtn.style.display = 'none';
        loggedInView.style.display = 'flex';
        document.getElementById('user-display').textContent = user.displayName || user.email;
        document.getElementById('user-img').src = user.photoURL || '';
        loadUserQrs();
      } else {
        loginBtn.style.display = 'block';
        loggedInView.style.display = 'none';
        document.getElementById('qr-list').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">
            Sign in with Google to view and manage your saved dynamic QR codes.
          </div>`;
      }
    });

    // Save QR
    document.getElementById('save-btn').addEventListener('click', async () => {
      if (!currentUser) {
        toast('⚠️ पहले ऊपर "Sign in with Google" करें!');
        return;
      }

      const dest = document.getElementById('qr-destination').value.trim();
      const name = document.getElementById('qr-name').value.trim() || 'My QR';

      if (!dest.startsWith('http://') && !dest.startsWith('https://')) {
        toast('⚠️ कृपया पूरा लिंक डालें (e.g. https://google.com)');
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        // 1. Save in public collection (for scanner redirect)
        await setDoc(doc(db, 'publicQr', currentId), {
          destination: dest,
          status: 'active',
          scans: 0,
          ownerUid: currentUser.uid
        });

        // 2. Save in user's private collection
        await setDoc(doc(db, 'users', currentUser.uid, 'qrCodes', currentId), {
          id: currentId,
          name: name,
          destination: dest,
          status: 'active',
          updatedAt: Date.now()
        });

        toast('✅ Dynamic QR Activated! अब इसे स्कैन करके टेस्ट कर सकते हैं।');
        loadUserQrs();
        
        // Prepare next QR
        currentId = generateId(8);
        qrDesigner.update({ data: getRedirectUrl(currentId) });
      } catch (err) {
        toast('❌ Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save & Activate Dynamic QR';
      }
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      qrDesigner.download({ name: 'dynamic-qr', extension: 'png' });
    });

    async function loadUserQrs() {
      if (!currentUser) return;
      const list = document.getElementById('qr-list');
      try {
        const snap = await getDocs(collection(db, 'users', currentUser.uid, 'qrCodes'));
        if (snap.empty) {
          list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No QR codes saved yet. Create your first one above!</div>';
          return;
        }
        list.innerHTML = '';
        snap.forEach(d => {
          const qr = d.data();
          const publicLink = getRedirectUrl(qr.id);
          const card = document.createElement('div');
          card.className = 'qr-item';
          card.innerHTML = `
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
                <strong style="color:#fff;">${qr.name}</strong>
                <span class="qr-badge ${qr.status === 'active' ? 'badge-active' : 'badge-paused'}">${qr.status}</span>
              </div>
              <p style="color:var(--text-muted); font-size:0.8rem; word-break:break-all; margin-bottom: 0.75rem;">
                🔗 ${qr.destination}
              </p>
            </div>
            <div style="display:flex; gap:0.4rem;">
              <button class="btn btn-outline btn-sm edit-btn" style="flex:1;">Change URL</button>
              <button class="btn btn-outline btn-sm copy-btn">Copy Link</button>
              <button class="btn btn-danger btn-sm delete-btn">Delete</button>
            </div>
          `;

          card.querySelector('.copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(publicLink);
            toast('QR link copied!');
          });

          card.querySelector('.edit-btn').addEventListener('click', () => {
            document.getElementById('modal-qr-id').value = qr.id;
            document.getElementById('modal-qr-name').value = qr.name;
            document.getElementById('modal-qr-dest').value = qr.destination;
            document.getElementById('edit-modal').classList.add('active');
          });

          card.querySelector('.delete-btn').addEventListener('click', async () => {
            if (confirm('Delete this QR?')) {
              await deleteDoc(doc(db, 'users', currentUser.uid, 'qrCodes', qr.id));
              await deleteDoc(doc(db, 'publicQr', qr.id));
              toast('Deleted!');
              loadUserQrs();
            }
          });

          list.appendChild(card);
        });
      } catch (e) {
        list.innerHTML = `<div style="grid-column: 1/-1; color: var(--danger); text-align: center;">Error: ${e.message}</div>`;
      }
    }

    document.getElementById('update-modal-btn').addEventListener('click', async () => {
      const qid = document.getElementById('modal-qr-id').value;
      const newDest = document.getElementById('modal-qr-dest').value.trim();
      const newName = document.getElementById('modal-qr-name').value.trim();

      if (!newDest.startsWith('http')) {
        toast('Enter valid URL starting with http:// or https://');
        return;
      }

      await updateDoc(doc(db, 'publicQr', qid), { destination: newDest });
      await updateDoc(doc(db, 'users', currentUser.uid, 'qrCodes', qid), {
        destination: newDest,
        name: newName
      });

      toast('✅ Destination updated! Scanners will now go to the new link.');
      document.getElementById('edit-modal').classList.remove('active');
      loadUserQrs();
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('edit-modal').classList.remove('active');
    });
  </script>
</body>
</html>
